# Dependabot only opens PRs against develop. Laravel lines (N.x) receive
# tooling updates through the normal port flow, retested on their own PHP range.
version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
