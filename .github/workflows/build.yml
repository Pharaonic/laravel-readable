name: Build

on:
  push:
    branches:
      - develop
      - "[0-9]*.x"
  pull_request:
    branches:
      - develop
      - "[0-9]*.x"
  workflow_dispatch:

concurrency:
  group: "build-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest

    outputs:
      php: ${{ steps.php.outputs.versions }}
      lowest: ${{ steps.php.outputs.lowest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Every Laravel line declares its PHP range as ">=8.A <8.B" in
      # composer.json, so the same workflow works on every N.x line.
      - name: Read the supported PHP minors
        id: php
        shell: bash
        run: |
          constraint="$(jq -r '.require.php' composer.json)"

          if [[ ! "$constraint" =~ ^\>=8\.([0-9]+)\ \<8\.([0-9]+)$ ]]; then
            echo "require.php must read \">=8.A <8.B\", got: $constraint" >&2
            exit 1
          fi

          versions="$(seq "${BASH_REMATCH[1]}" $((BASH_REMATCH[2] - 1)) | sed 's/^/8./' | jq -Rnc '[inputs]')"

          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "lowest=8.${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  build:
    name: PHP ${{ matrix.php }} - ${{ matrix.os }} - ${{ matrix.dependencies }}${{ matrix.intl && ' - intl' || '' }}
    needs: matrix

    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.matrix.outputs.php) }}
        dependencies:
          - lowest
          - highest
        os:
          - ubuntu-latest
          - windows-latest
        intl:
          - true
        include:
          # ext-intl is optional; only non-English getNumberToString() needs it.
          - php: ${{ needs.matrix.outputs.lowest }}
            dependencies: highest
            os: ubuntu-latest
            intl: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, mbstring, pdo_sqlite, sqlite3, ${{ matrix.intl && 'intl' || ':intl' }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      # Pint and PHPStan run once, on the lowest PHP with the highest
      # dependencies: a newer PHP installs a newer Pint with extra rules.
      - name: Check
        if: matrix.os == 'ubuntu-latest' && matrix.php == needs.matrix.outputs.lowest && matrix.dependencies == 'highest' && matrix.intl
        run: composer check

      - name: Run tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.php == needs.matrix.outputs.lowest && matrix.dependencies == 'highest' && matrix.intl) }}
        run: composer test
